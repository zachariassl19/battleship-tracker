name: Validate Battleship
on:
  pull_request:
  push:
    branches:
      - main
      - feature/secure-cross-device-fleet-sync
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check campaign JSON
        run: python3 -m json.tool data/game.json > /dev/null
      - name: Extract embedded JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.DOTALL)
          assert len(scripts) == 1, "Expected a single inline JavaScript block"
          Path("/tmp/battleship-check.js").write_text(scripts[0], encoding="utf-8")
          PY
      - name: Check JavaScript syntax
        run: node --check /tmp/battleship-check.js
      - name: Check secret synchronization JavaScript
        run: node --check secret-sync.js
      - name: Test encryption and fleet validation
        run: node --test tests/secret-sync.test.cjs
      - name: Test grid tap coordinates
        run: node --test tests/grid-coordinates.test.cjs
